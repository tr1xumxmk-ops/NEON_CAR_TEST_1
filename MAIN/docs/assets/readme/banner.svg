    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172641"/><stop offset="1" stop-color="#111527"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54eaff"/><stop offset="1" stop-color="#a8fff0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#58dfff" stroke-opacity=".09" stroke-width="1"/></pattern>
