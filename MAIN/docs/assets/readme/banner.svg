<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SPARK CAR Live Companion Edition</title>
  <desc id="desc">Dark neon technology banner with cyan and magenta trace lines and a stylized robot companion.</desc>
  <defs>
